<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cal-1 Store Screenshot Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #151a24 0%, #0a0c10 80%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
    }

    /* Ambient background grid */
    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 80%);
      pointer-events: none;
    }

    /* Top presentation banner */
    .header-banner {
      margin-top: 28px;
      margin-bottom: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(0, 255, 100, 0.08);
      border: 1px solid rgba(0, 255, 100, 0.25);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #00ff66;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    .scene-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .scene-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: #94a3b8;
      max-width: 680px;
      line-height: 1.4;
    }

    /* Chrome browser mockup container */
    .browser-frame {
      width: 1040px;
      background: #1e222b;
      border-radius: 10px 10px 0 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 25px 65px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .browser-titlebar {
      height: 38px;
      background: #14171f;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 14px;
    }

    .window-dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .browser-tab {
      background: #1e222b;
      padding: 6px 14px;
      border-radius: 6px 6px 0 0;
      font-size: 11.5px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: none;
    }

    .browser-toolbar {
      height: 42px;
      background: #1e222b;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-arrows {
      display: flex;
      gap: 8px;
      color: #64748b;
      font-size: 13px;
    }

    .address-bar {
      flex: 1;
      height: 28px;
      background: #0f1117;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 12px;
      color: #94a3b8;
      gap: 8px;
    }

    .address-bar svg {
      opacity: 0.6;
    }

    .extension-toolbar-icons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ext-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .ext-icon-btn.active {
      background: rgba(0, 255, 100, 0.15);
      border: 1px solid rgba(0, 255, 100, 0.3);
    }

    /* Popup mount point inside browser viewport */
    .browser-viewport {
      height: 580px;
      background: #0f1218;
      position: relative;
      display: flex;
      justify-content: flex-end;
      padding-right: 18px;
      padding-top: 10px;
    }

    .popup-wrapper {
      position: relative;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      overflow: hidden;
      background: #000000;
    }

    iframe#popupFrame {
      border: none;
      display: block;
      width: 650px;
      height: 520px;
      transition: width 0.2s ease, height 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="ambient-grid"></div>

  <div class="header-banner">
    <div class="badge-pill">
      <span class="badge-dot"></span>
      <span id="badgeText">cal-1 • Unix Terminal Calendar</span>
    </div>
    <h1 class="scene-title" id="sceneTitle">4-Month 2×2 Overview</h1>
    <p class="scene-subtitle" id="sceneSubtitle">Effortlessly glance at 4 consecutive months with command line prompt and directional scan transitions</p>
  </div>

  <div class="browser-frame">
    <div class="browser-titlebar">
      <div class="window-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="browser-tab">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Google Calendar</span>
      </div>
    </div>

    <div class="browser-toolbar">
      <div class="nav-arrows">
        <span>←</span>
        <span>→</span>
        <span>⟳</span>
      </div>
      <div class="address-bar">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>calendar.google.com</span>
      </div>
      <div class="extension-toolbar-icons">
        <div class="ext-icon-btn active" title="cal-1 active">
          <img src="/icons/icon-16.png" width="16" height="16" alt="cal-1" />
        </div>
      </div>
    </div>

    <div class="browser-viewport">
      <div class="popup-wrapper" id="popupWrapper">
        <iframe id="popupFrame" src="/popup/popup.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('message', (e) => {
      // Ready for remote control
    });
  </script>
</body>
</html>
