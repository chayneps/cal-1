<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cal-1 Promotional Tiles Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      user-select: none;
      background: #000;
    }

    /* -------------------------------------------------------------
       Small Promo Tile: 440 x 280
       ------------------------------------------------------------- */
    #promoSmall {
      width: 440px;
      height: 280px;
      position: relative;
      background: radial-gradient(circle at 35% 20%, #151e2b 0%, #07090d 90%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px 16px 18px;
      border: 1px solid #1e2633;
      overflow: hidden;
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 100, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 100, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      mask-image: radial-gradient(circle at 40% 40%, black 40%, transparent 85%);
      pointer-events: none;
    }

    .glow-orb-small {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 180px;
      height: 140px;
      background: radial-gradient(ellipse at center, rgba(0, 255, 100, 0.15) 0%, transparent 70%);
      filter: blur(28px);
      pointer-events: none;
    }

    /* Left branding column */
    .small-left {
      width: 175px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    .small-brand-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .small-app-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), 0 0 8px rgba(0, 255, 100, 0.3);
      flex-shrink: 0;
    }

    .small-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 20px;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.5);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .brand-arrow {
      color: #ff007f;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
    }

    .small-tagline {
      font-size: 11px;
      line-height: 1.35;
      color: #94a3b8;
      font-weight: 500;
    }

    .small-pills {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      letter-spacing: 0.2px;
      width: fit-content;
    }
    .pill-green {
      background: rgba(0, 255, 100, 0.1);
      border: 1px solid rgba(0, 255, 100, 0.35);
      color: #00ff66;
    }
    .pill-cyan {
      background: rgba(0, 229, 229, 0.1);
      border: 1px solid rgba(0, 229, 229, 0.35);
      color: #00e5e5;
    }

    /* Right app screenshot container */
    .small-right {
      position: relative;
      z-index: 2;
      width: 252px;
      height: 202px;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 100, 0.45);
      box-shadow: 
        0 14px 35px rgba(0, 0, 0, 0.9),
        0 0 16px rgba(0, 255, 100, 0.25);
      background: #0c1017;
      display: block;
    }

    .small-right iframe {
      width: 650px !important;
      min-width: 650px !important;
      max-width: 650px !important;
      height: 520px !important;
      min-height: 520px !important;
      border: none;
      transform: scale(0.3876);
      transform-origin: top left;
      pointer-events: none;
      display: block;
    }

    /* -------------------------------------------------------------
       Marquee Promo Tile: 1400 x 560
       ------------------------------------------------------------- */
    #promoMarquee {
      width: 1400px;
      height: 560px;
      position: relative;
      background: radial-gradient(circle at 65% 35%, #16202d 0%, #06080b 85%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 70px 0 80px;
      border: 1px solid #1a222d;
      overflow: hidden;
    }

    .marquee-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 2;
      max-width: 660px;
    }

    .prompt-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 255, 100, 0.3);
      border-radius: 6px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      color: #94a3b8;
      width: fit-content;
    }
    .prompt-chip .p-name { color: #00e5e5; font-weight: bold; }
    .prompt-chip .p-dir { color: #00ff66; }
    .prompt-chip .p-branch { color: #ff007f; }

    .marquee-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 60px;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 35px rgba(0, 255, 102, 0.5);
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .marquee-desc {
      font-size: 20px;
      line-height: 1.45;
      color: #cbd5e1;
      font-weight: 400;
    }

    .marquee-pills {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .marquee-pills .pill {
      font-size: 13px;
      padding: 6px 14px;
    }
    .pill-gold {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #eab308;
    }

    .marquee-right {
      position: relative;
      z-index: 2;
      width: 618px;
      height: 494px;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid rgba(0, 255, 100, 0.45);
      box-shadow: 
        0 25px 65px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 255, 100, 0.3);
      background: #0c1017;
      display: block;
    }

    .marquee-right iframe {
      width: 650px !important;
      min-width: 650px !important;
      max-width: 650px !important;
      height: 520px !important;
      min-height: 520px !important;
      border: none;
      transform: scale(0.95);
      transform-origin: top left;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Small Promo Tile (440 x 280) -->
  <div id="promoSmall">
    <div class="ambient-grid"></div>
    <div class="glow-orb-small"></div>

    <div class="small-left">
      <div class="small-brand-header">
        <img class="small-app-icon" src="../icons/icon-128.png" alt="icon">
        <div class="small-title">
          <span class="brand-arrow">➜</span>
          <span>cal-1</span>
        </div>
      </div>

      <div class="small-tagline">
        Unix cal & Spaceship Prompt for Chrome
      </div>

      <div class="small-pills">
        <span class="pill pill-green">✓ 4-Month 2×2 View</span>
        <span class="pill pill-cyan">✓ Google Sync</span>
      </div>
    </div>

    <!-- App Screen Mockup (No Chrome frame) -->
    <div class="small-right">
      <iframe width="650" height="520" src="../popup/popup.html"></iframe>
    </div>
  </div>

  <!-- Marquee Promo Tile (1400 x 560) -->
  <div id="promoMarquee" style="margin-top: 40px;">
    <div class="ambient-grid" style="background-size: 28px 28px;"></div>

    <div class="marquee-left">
      <div class="prompt-chip">
        <span class="p-name">cal-1</span>
        <span class="p-dir">~</span>
        <span>on</span>
        <span class="p-branch">⎇ main</span>
      </div>

      <div class="marquee-title">
        <span class="brand-arrow">➜</span>
        <span>cal-1</span>
      </div>

      <div class="marquee-desc">
        Unix cal-inspired dropdown calendar with Spaceship prompt styling, 4-month overview, and seamless Google Calendar & Tasks sync.
      </div>

      <div class="marquee-pills">
        <span class="pill pill-green">4-Month 2×2 Overview</span>
        <span class="pill pill-cyan">Google Calendar &amp; Tasks</span>
        <span class="pill pill-gold">100% Local &amp; Private</span>
      </div>
    </div>

    <!-- App Screen Mockup (No Chrome frame) -->
    <div class="marquee-right">
      <iframe width="650" height="520" src="../popup/popup.html"></iframe>
    </div>
  </div>

</body>
</html>
